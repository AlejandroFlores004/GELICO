<div class="flex flex-wrap items-end justify-between gap-5">
    <div class="flex items-center gap-4">
        <div class="bg-primary text-primary-content rounded-2xl p-4 shadow-md shadow-primary/20">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor" class="w-8 h-8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3v11.25A2.25 2.25 0 0 0 6 16.5h2.25M3.75 3h-1.5m1.5 0h16.5m0 0h1.5m-1.5 0v11.25A2.25 2.25 0 0 1 18 16.5h-2.25m-7.5 0h7.5m-7.5 0-1 3m8.5-3 1 3m0 0 .5 1.5m-.5-1.5h-9.5m0 0-.5 1.5M9 11.25v1.5M12 9v3.75m3-6v6" />
            </svg>
        </div>
        <div>
            <h1 class="text-4xl font-bold">
                Hola, {{ user.first_name|default:user.username }}
            </h1>
            <p class="text-base-content/70 first-letter:uppercase">
                {{ hoy|date:"l j \d\e F \d\e Y" }} · Resumen general de liquidaciones, escuelas y programación.
            </p>
        </div>
    </div>

    <div class="flex flex-wrap items-center gap-3">
        {% if anios %}
        <div class="flex items-center gap-2">
            <span class="text-sm font-medium text-base-content/60">Año</span>
            <div class="join">
                {% for opcion in anios %}
                <a href="?anio={{ opcion }}" class="btn btn-sm join-item {% if anio == opcion %}btn-primary{% else %}btn-ghost border-base-300{% endif %}">{{ opcion }}</a>
                {% endfor %}
                <a href="?anio=todos" class="btn btn-sm join-item {% if not anio %}btn-primary{% else %}btn-ghost border-base-300{% endif %}">Todos</a>
            </div>
        </div>
        {% endif %}

        <div class="flex gap-2">
            <a href="{% url 'home_asignaciones' %}" class="btn btn-primary btn-sm gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
                </svg>
                Buscar liquidación
            </a>
            <a href="{% url 'home_carga_excel' %}" class="btn btn-secondary btn-sm gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5m-13.5-9L12 3m0 0 4.5 4.5M12 3v13.5" />
                </svg>
                Cargar Excel
            </a>
        </div>
    </div>
</div>
