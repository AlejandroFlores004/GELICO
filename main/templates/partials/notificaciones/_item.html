{# Una notificación: punto de color por nivel, título, detalle y enlace a donde se resuelve. #}
<a href="{{ notificacion.url }}" class="group flex items-start gap-3 rounded-lg px-3 py-2.5 transition-colors hover:bg-base-200">
    <span class="mt-1.5 size-2.5 shrink-0 rounded-full {% if notificacion.nivel == 'error' %}bg-error{% elif notificacion.nivel == 'warning' %}bg-warning{% else %}bg-info{% endif %}"
          title="{% if notificacion.nivel == 'error' %}Urgente{% elif notificacion.nivel == 'warning' %}Por atender{% else %}Informativa{% endif %}"></span>
    <span class="min-w-0 flex-1">
        <span class="block text-sm font-medium leading-snug group-hover:text-primary">{{ notificacion.titulo }}</span>
        <span class="mt-0.5 block text-xs leading-snug text-base-content/60">{{ notificacion.detalle }}</span>
    </span>
    {% if mostrar_categoria %}
    <span class="badge badge-ghost badge-sm shrink-0">{{ notificacion.categoria }}</span>
    {% endif %}
</a>
