<!-- ===== MOBILE DOCK (below md) ===== -->
<div class="dock md:hidden fixed bottom-0 left-0 right-0 bg-base-100 border-t border-base-300 z-50 flex justify-around items-center h-16 px-2 shadow-[0_-2px_10px_rgba(0,0,0,0.08)]">

  <!-- Escuelas -->
  <div class="dropdown dropdown-top dropdown-center">
    <div tabindex="0" role="button"
         class="dock-item flex flex-col items-center gap-1 text-xs py-2 px-4 rounded-lg transition-colors
                {% if request.resolver_match.url_name == 'escuelas' %}text-primary font-semibold{% else %}text-base-content/60 hover:text-base-content{% endif %}">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
        <path d="M6 12v5c0 1.1 2.7 3 6 3s6-1.9 6-3v-5"/>
      </svg>
      <span>Escuelas</span>
    </div>
    <ul tabindex="0" class="dropdown-content menu bg-base-100 rounded-box z-[1] w-48 p-2 shadow-md border border-base-300 mb-2">
      <li><a href="#">Elemento 1</a></li>
      <li><a href="#">Elemento 2</a></li>
      <li><a href="#">Elemento 3</a></li>
    </ul>
  </div>
