{# Encabezado desplegable "Más filtros". Va como primer hijo de un <details class="group">. Recibe: detalle #}
<summary class="inline-flex items-center gap-1 cursor-pointer select-none text-sm font-medium text-primary hover:underline list-none [&::-webkit-details-marker]:hidden">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 transition-transform group-open:rotate-90">
        <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
    </svg>
    <span class="group-open:hidden">Más filtros</span>
    <span class="hidden group-open:inline">Menos filtros</span>
    {% if detalle %}<span class="text-base-content/50 font-normal">({{ detalle }})</span>{% endif %}
</summary>
