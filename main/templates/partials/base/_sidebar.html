{% load static %}
<div class="drawer-side z-20">
  <label for="main-drawer" aria-label="close sidebar" class="drawer-overlay"></label>

  <div class="flex min-h-full flex-col bg-base-200 border-r border-base-300 w-64">

    <!-- Sidebar Header -->
    <div class="border-b border-base-300 bg-base-100 p-3">
      <div class="flex items-center gap-2">
        <!-- Logo -->
        <div class="flex size-9 shrink-0 items-center justify-center rounded-lg bg-primary/10">
          <img src="{% static 'logo.svg' %}" alt="Favicon"
              class="size-6 object-contain"/>
        </div>

        <!-- Title -->
        <div class="min-w-0">
          <h2 class="font-semibold leading-tight tracking-tight text-sm truncate">Gestion de Liquidaciones y Convocatorias</h2>
          <p class="text-xs opacity-60">(GELICO)</p>
        </div>
      </div>
    </div>

    <!-- Menu -->
    <ul class="menu menu-sm w-full grow gap-0.5 px-2 py-3">

      <!-- Escuelas -->
      <li class="menu-title flex-row items-center gap-2 text-[11px] font-bold! uppercase tracking-wide text-base-content/60!">
        <svg xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            stroke-linejoin="round"
            stroke-linecap="round"
            stroke-width="2"
            fill="none"
            stroke="currentColor"
            class="inline-block size-4">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
          <path d="M6 12v5c0 1.1 2.7 3 6 3s6-1.9 6-3v-5"/>
        </svg>
        <span>Escuelas</span>
      </li>
      <li>
        <a href="#" class="pointer-events-none opacity-50">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-linejoin="round" stroke-linecap="round"
              stroke-width="2" fill="none" stroke="currentColor" class="inline-block size-4">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
            <path d="M6 12v5c0 1.1 2.7 3 6 3s6-1.9 6-3v-5"/>
          </svg>
          <span>Escuelas</span>
          <span class="badge badge-ghost badge-xs ml-auto">Pronto</span>
        </a>
      </li>
      <li>
        <a href="{% url 'home_encargados' %}" class="{% if request.resolver_match.url_name == 'home_encargados' %}menu-active{% endif %}">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-linejoin="round" stroke-linecap="round"
              stroke-width="2" fill="none" stroke="currentColor" class="inline-block size-4">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <span>Encargados</span>
        </a>
      </li>
      <li>
        <a href="#" class="pointer-events-none opacity-50">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-linejoin="round" stroke-linecap="round"
              stroke-width="2" fill="none" stroke="currentColor" class="inline-block size-4">
            <path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          <span>CDE</span>
          <span class="badge badge-ghost badge-xs ml-auto">Pronto</span>
        </a>
      </li>

      <li class="my-1">
        <div class="divider my-0 opacity-40"></div>
      </li>

      <!-- Programación -->
      <li class="menu-title flex-row items-center gap-2 text-[11px] font-bold! uppercase tracking-wide text-base-content/60!">
        <svg xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            stroke-linejoin="round"
            stroke-linecap="round"
            stroke-width="2"
            fill="none"
            stroke="currentColor"
            class="inline-block size-4">
          <rect x="3" y="4" width="18" height="18" rx="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        <span>Programación</span>
      </li>
      <li>
        <a href="{% url 'home_convocatorias' %}" class="{% if request.resolver_match.url_name == 'home_convocatorias' %}menu-active{% endif %}">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-linejoin="round" stroke-linecap="round"
              stroke-width="2" fill="none" stroke="currentColor" class="inline-block size-4">
            <path d="m3 11 18-5v12L3 14v-3z"/>
            <path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/>
          </svg>
          <span>Convocatorias</span>
        </a>
      </li>
      <li>
        <a href="#" class="pointer-events-none opacity-50">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-linejoin="round" stroke-linecap="round"
              stroke-width="2" fill="none" stroke="currentColor" class="inline-block size-4">
            <rect x="3" y="4" width="18" height="18" rx="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
            <path d="M8 14h.01"/>
            <path d="M12 14h.01"/>
            <path d="M16 14h.01"/>
          </svg>
          <span>Calendario</span>
          <span class="badge badge-ghost badge-xs ml-auto">Pronto</span>
        </a>
      </li>
      <li>
        <a href="{% url 'home_auxiliar' %}" class="{% if request.resolver_match.url_name == 'home_auxiliar' %}menu-active{% endif %}">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-linejoin="round" stroke-linecap="round"
              stroke-width="2" fill="none" stroke="currentColor" class="inline-block size-4">
            <rect x="8" y="2" width="8" height="4" rx="1"/>
            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
            <path d="M9 12h6"/>
            <path d="M9 16h6"/>
          </svg>
          <span>Auxiliar</span>
        </a>
      </li>

      <li class="my-1">
        <div class="divider my-0 opacity-40"></div>
      </li>

      <!-- Movimientos -->
      <li class="menu-title flex-row items-center gap-2 text-[11px] font-bold! uppercase tracking-wide text-base-content/60!">
        <svg xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            stroke-linejoin="round"
            stroke-linecap="round"
            stroke-width="2"
            fill="none"
            stroke="currentColor"
            class="inline-block size-4">
          <path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/>
          <path d="M16 8h-6"/>
          <path d="M16 12h-6"/>
          <path d="M13 16h-3"/>
        </svg>
        <span>Movimientos</span>
      </li>
      <li>
        <a href="{% url 'home_liquidaciones' %}" class="{% if request.resolver_match.url_name == 'home_liquidaciones' %}menu-active{% endif %}">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-linejoin="round" stroke-linecap="round"
              stroke-width="2" fill="none" stroke="currentColor" class="inline-block size-4">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 6v2m0 8v2"/>
            <path d="M9.5 15a2.5 2.5 0 0 0 2.5 2c1.5 0 2.5-.8 2.5-2s-1-1.6-2.5-2-2.5-.8-2.5-2 1-2 2.5-2a2.5 2.5 0 0 1 2.5 2"/>
          </svg>
          <span>Liquidaciones</span>
        </a>
      </li>
      <li>
        <a href="{% url 'home_asignaciones' %}" class="{% if request.resolver_match.url_name == 'home_asignaciones' %}menu-active{% endif %}">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-linejoin="round" stroke-linecap="round"
              stroke-width="2" fill="none" stroke="currentColor" class="inline-block size-4">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="m17 11 2 2 4-4"/>
          </svg>
          <span>Asignaciones</span>
        </a>
      </li>
      <li>
        <a href="{% url 'home_transferencias' %}" class="{% if request.resolver_match.url_name == 'home_transferencias' %}menu-active{% endif %}">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-linejoin="round" stroke-linecap="round"
              stroke-width="2" fill="none" stroke="currentColor" class="inline-block size-4">
            <path d="M8 3 4 7l4 4"/>
            <path d="M4 7h16"/>
            <path d="m16 21 4-4-4-4"/>
            <path d="M20 17H4"/>
          </svg>
          <span>Transferencias</span>
        </a>
      </li>

      <li class="my-1">
        <div class="divider my-0 opacity-40"></div>
      </li>

      <!-- Sitio desarrollo -->
      <li>
        <a href="{% url 'admin:index' %}" class="{% if request.resolver_match.namespace == 'admin' %}menu-active{% endif %}">
          <svg xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              stroke-linejoin="round"
              stroke-linecap="round"
              stroke-width="2"
              fill="none"
              stroke="currentColor"
              class="inline-block size-4">
            <polyline points="8 9 4 12 8 15"/>
            <polyline points="16 9 20 12 16 15"/>
            <line x1="14" y1="4" x2="10" y2="20"/>
          </svg>
          <span>Sitio Desarrollo</span>
        </a>
      </li>

    </ul>
  </div>
</div>
