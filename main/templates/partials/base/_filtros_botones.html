{# Botones Limpiar / Buscar de los buscadores. Recibe: limpiar_url, spinner_id #}
<div class="flex gap-2 shrink-0">
    <a href="{{ limpiar_url }}" class="btn btn-ghost gap-2" title="Limpiar filtros">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
        Limpiar
    </a>
    <button type="submit" class="btn btn-primary gap-2 flex-1 sm:flex-none sm:min-w-32">
        <span id="{{ spinner_id }}" class="htmx-indicator loading loading-spinner loading-sm"></span>
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
        </svg>
        Buscar
    </button>
</div>
