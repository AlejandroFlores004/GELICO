{% load static %}

<!-- ===== NAVBAR (md and up) ===== -->
<nav class="navbar bg-base-100 shadow-md px-6 hidden md:flex">
  <div class="flex-1">
    <a href="/" class="text-xl font-bold">Agua Potable Santa Fe</a>
  </div>

  <!-- Nav links -->
  <div class="flex-none gap-1">
    <a href="#"
       class="btn btn-ghost btn-sm gap-2 {% if request.resolver_match.url_name == 'clientes' %}btn-active{% endif %}">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      Clientes
    </a>

    <a href="#"
       class="btn btn-ghost btn-sm gap-2 {% if request.resolver_match.url_name == 'mechas' %}btn-active{% endif %}">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
      </svg>
      Mechas
    </a>

    <a href="#"
       class="btn btn-ghost btn-sm gap-2 {% if request.resolver_match.url_name == 'recibos' %}btn-active{% endif %}">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="16" y1="13" x2="8" y2="13"/>
        <line x1="16" y1="17" x2="8" y2="17"/>
        <polyline points="10 9 9 9 8 9"/>
      </svg>
      Recibos
    </a>
  </div>

  <!-- User + logout -->
  <div class="flex-none gap-2 items-center ml-4 pl-4 border-l border-base-300">
    <span class="text-sm text-gray-500">{{ request.user.username }}</span>
    <a href="{% url 'logout' %}" class="btn btn-ghost btn-sm">Salir</a>
  </div>
</nav>
