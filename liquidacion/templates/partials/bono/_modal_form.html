<div id="bono-modal-wrapper">
    <dialog id="bono-modal" class="modal">
        <div class="modal-box max-w-lg rounded-2xl border border-base-300 shadow-2xl">
            <form method="dialog">
                <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2" aria-label="Cerrar">✕</button>
            </form>

            <h3 class="font-bold text-xl">
                {% if instance %}Editar Bono{% else %}Agregar Bono{% endif %}
            </h3>

            <form
                hx-post="{% if instance %}{% url 'bono_editar' instance.pk %}{% else %}{% url 'bono_nuevo' %}{% endif %}{% querystring %}"
                hx-target="#bono-modal-wrapper"
                hx-swap="outerHTML"
                class="space-y-4 mt-4"
            >
                {% csrf_token %}
                {% for field in form %}
                <div class="form-control w-full">
                    <label class="label" for="{{ field.id_for_label }}">
                        <span class="label-text font-medium">{{ field.label }}</span>
                    </label>
                    {{ field }}
                    {% if field.errors %}<span class="text-error text-xs mt-1">{{ field.errors.0 }}</span>{% endif %}
                </div>
                {% endfor %}

                <div class="modal-action">
                    <button type="button" class="btn btn-ghost" onclick="document.getElementById('bono-modal').close()">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
        <form method="dialog" class="modal-backdrop">
            <button>close</button>
        </form>
    </dialog>
    <script>
        (function () {
            var wrapper = document.currentScript.closest('#bono-modal-wrapper');
            var dialog = wrapper.querySelector('#bono-modal');
            dialog.showModal();
            dialog.addEventListener('close', function () { wrapper.innerHTML = ''; }, { once: true });
        })();
    </script>
</div>
