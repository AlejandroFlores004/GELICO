<div class="card bg-base-100 shadow-md border border-base-300">
    <div class="card-body p-4 sm:p-5 gap-3">
        <form
            hx-get="{% url 'buscar_bonos' %}"
            hx-target="#listado-bonos"
            hx-swap="outerHTML"
            hx-indicator="#bono-search-spinner"
            class="space-y-3"
        >
            <div class="flex flex-col sm:flex-row sm:items-end gap-2">
                <div class="form-control w-full">
                    <label class="label pt-0 pb-1" for="bono-search-text">
                        <span class="label-text font-medium">Buscar bono</span>
                    </label>
                    <input id="bono-search-text" type="text" name="q" value="{{ search|default:'' }}" class="input input-bordered w-full" placeholder="Nombre, descripción o ID">
                </div>
                {% url 'home_bonos' as limpiar %}{% include "partials/base/_filtros_botones.html" with limpiar_url=limpiar spinner_id="bono-search-spinner" %}
            </div>

            <details class="group"{% if anio %} open{% endif %}>
                {% include "partials/base/_filtros_toggle.html" with detalle="año" %}
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 pt-3">
                    <div class="form-control w-full">
                        <label class="label pt-0 pb-1" for="bono-search-anio">
                            <span class="label-text font-medium">Año</span>
                        </label>
                        <select id="bono-search-anio" name="anio" class="select select-bordered w-full">
                            <option value="">Todos los años</option>
                            {% for opcion in anios %}
                            <option value="{{ opcion }}" {% if opcion|stringformat:"s" == anio %}selected{% endif %}>{{ opcion }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
            </details>
        </form>
    </div>
</div>
