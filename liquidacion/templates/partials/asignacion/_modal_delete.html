<div id="asignacion-modal-wrapper">
    <dialog id="asignacion-modal" class="modal">
        <div class="modal-box rounded-2xl border border-base-300 shadow-2xl">
            <form method="dialog">
                <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2" aria-label="Cerrar">✕</button>
            </form>
            <h3 class="font-bold text-lg">Eliminar Asignación</h3>
            <p class="text-base-content/70 text-sm mt-2">
                Esta acción no se puede deshacer. Si la asignación tiene recibos y abonos asociados, también se eliminarán.
            </p>
            <div class="bg-base-200 rounded-lg p-4 mt-5 space-y-2 text-sm">
                <div class="flex justify-between gap-4"><span class="text-base-content/60">Escuela</span><span class="font-medium text-right">{{ instance.escuela.nombre_corto }}</span></div>
                <div class="flex justify-between gap-4"><span class="text-base-content/60">Bono</span><span class="font-medium text-right">{{ instance.bono.nombre }}</span></div>
                <div class="flex justify-between gap-4"><span class="text-base-content/60">Valor</span><span class="font-medium text-right">${{ instance.valor|floatformat:2 }}</span></div>
            </div>
            <form hx-post="{% url 'asignacion_eliminar' instance.pk %}{% querystring %}" hx-target="#asignacion-modal-wrapper" hx-swap="outerHTML">
                {% csrf_token %}
                <div class="modal-action">
                    <button type="button" class="btn btn-ghost" onclick="document.getElementById('asignacion-modal').close()">Cancelar</button>
                    <button type="submit" class="btn btn-error">Borrar</button>
                </div>
            </form>
        </div>
        <form method="dialog" class="modal-backdrop">
            <button>close</button>
        </form>
    </dialog>
    <script>
        (function () {
            var wrapper = document.currentScript.closest('#asignacion-modal-wrapper');
            var dialog = wrapper.querySelector('#asignacion-modal');
            dialog.showModal();
            dialog.addEventListener('close', function () { wrapper.innerHTML = ''; }, { once: true });
        })();
    </script>
</div>
