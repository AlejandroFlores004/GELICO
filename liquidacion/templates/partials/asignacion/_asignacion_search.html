<div class="card bg-base-100 shadow-xl">
    <div class="card-body">

        <h2 class="card-title gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 text-primary">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 6h9.75M10.5 6a1.5 1.5 0 11-3 0m3 0a1.5 1.5 0 10-3 0M3.75 6H7.5m3 12h9.75m-9.75 0a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m-3.75 0H7.5m9-6h3.75m-3.75 0a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m-9.75 0h9.75" />
            </svg>
            Buscar Asignaciones
        </h2>

        <div class="divider my-1"></div>

        <form class="space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">

                <div class="form-control w-full">
                    <label class="label" for="filtro-escuela">
                        <span class="label-text font-medium">Escuela</span>
                    </label>
                    <select id="filtro-escuela" class="select select-bordered w-full">
                        <option value="" selected>Todas las escuelas</option>
                        <option>Centro Escolar Simón Bolívar</option>
                        <option>Escuela Bilingüe San Rafael</option>
                        <option>Complejo Educativo Las Delicias</option>
                    </select>
                </div>

                <div class="form-control w-full">
                    <label class="label" for="filtro-bono">
                        <span class="label-text font-medium">Bono</span>
                    </label>
                    <select id="filtro-bono" class="select select-bordered w-full">
                        <option value="" selected>Todos los bonos</option>
                        <option>Bono de Alimentación</option>
                        <option>Bono de Útiles Escolares</option>
                        <option>Bono de Mantenimiento</option>
                    </select>
                </div>

                <div class="form-control w-full">
                    <label class="label" for="filtro-fecha-desde">
                        <span class="label-text font-medium">Fecha desde</span>
                    </label>
                    <input type="date" id="filtro-fecha-desde" class="input input-bordered w-full" />
                </div>

                <div class="form-control w-full">
                    <label class="label" for="filtro-fecha-hasta">
                        <span class="label-text font-medium">Fecha hasta</span>
                    </label>
                    <input type="date" id="filtro-fecha-hasta" class="input input-bordered w-full" />
                </div>

            </div>

            <div class="card-actions justify-end">
                <button type="button" class="btn btn-ghost gap-2">
                    Limpiar
                </button>
                <button type="submit" class="btn btn-primary gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
                    </svg>
                    Buscar
                </button>
            </div>
        </form>
    </div>
</div>
