<div class="card bg-base-100 shadow-xl h-full border border-base-200">
    <div class="card-body">
        <h2 class="card-title gap-2">
            <span class="flex items-center justify-center w-9 h-9 rounded-xl bg-primary/10 text-primary">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 6v.75m0 3v.75m0 3v.75m0 3V18m-9-5.25h5.25M7.5 15h3M3.375 5.25c-.621 0-1.125.504-1.125 1.125v3.026a2.999 2.999 0 010 5.198v3.026c0 .621.504 1.125 1.125 1.125h17.25c.621 0 1.125-.504 1.125-1.125v-3.026a2.999 2.999 0 010-5.198V6.375c0-.621-.504-1.125-1.125-1.125H3.375z" />
                </svg>
            </span>
            Bono
        </h2>
        <p class="text-sm text-base-content/60 -mt-1">
            Selecciona un bono para ver su asignación, transferencias y recibos.
        </p>

        <div class="divider my-1"></div>

        <form
            hx-get="{% url 'buscar_bono' %}"
            hx-target="#bono-info"
            hx-swap="outerHTML"
            hx-indicator="#bono-search-spinner"
            class="space-y-4"
        >
            <input type="hidden" name="escuela" value="{{ escuela.id }}">

            <div class="form-control w-full">
                <label class="label" for="{{ seleccionarBono.bono.id_for_label }}">
                    <span class="label-text font-medium">Bono</span>
                </label>
                <div class="w-full" id="bono-select-wrapper">
                    {{ seleccionarBono.bono }}
                </div>
            </div>

            <div class="card-actions justify-end">
                <button type="submit" class="btn btn-primary w-full sm:w-auto gap-2">
                    <span id="bono-search-spinner" class="htmx-indicator loading loading-spinner loading-sm"></span>
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
                    </svg>
                    Buscar
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    $('#bono-select-wrapper .django-select2').djangoSelect2({ width: '100%' });
</script>
