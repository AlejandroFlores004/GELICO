<div class="card bg-base-100 border border-base-300 shadow-sm">
    <div class="card-body gap-4">
        <div class="flex items-start gap-3">
            <div class="bg-primary/10 text-primary rounded-xl p-2.5">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor" class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m3.75 9v6m3-3H9m1.5-12H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" />
                </svg>
            </div>
            <div>
                <h2 class="card-title text-lg">REPORTE TRANSFERIDO POR RECIBO</h2>
                <p class="text-sm text-base-content/70">
                    Sube aquí este archivo para que el sistema tome de él la información de la liquidación correspondiente a cada recibo.
                </p>
            </div>
        </div>

        <form
            hx-post="{% url 'carga_recibos_procesar' %}"
            hx-target="#recibos-modal-wrapper"
            hx-swap="outerHTML"
            hx-encoding="multipart/form-data"
            data-modal-cargando
            class="contents"
        >
            {% csrf_token %}

            {% include "partials/carga_excel/_zona_archivo.html" with modal_columnas="columnas-recibos-modal" %}
        </form>
    </div>
</div>
