<div class="card bg-base-100 border border-base-300 shadow-sm">
    <div class="card-body gap-4">
        <div class="flex items-start gap-3">
            <div class="bg-primary/10 text-primary rounded-xl p-2.5">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor" class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C6.5 20.496 5.996 21 5.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z" />
                </svg>
            </div>
            <div>
                <h2 class="card-title text-lg">TRANSFERENCIAS 20xx</h2>
                <p class="text-sm text-base-content/70">
                    Sube aquí el archivo de detalle de monto programado y transferido: el sistema tomará de él los bonos junto con su código.
                </p>
            </div>
        </div>

        <form
            hx-post="{% url 'carga_bonos_preview' %}"
            hx-target="#bonos-modal-wrapper"
            hx-swap="outerHTML"
            hx-encoding="multipart/form-data"
            data-modal-cargando
            class="contents"
        >
            {% csrf_token %}

            {% include "partials/carga_excel/_zona_archivo.html" with modal_columnas="columnas-bonos-modal" %}
        </form>
    </div>
</div>
