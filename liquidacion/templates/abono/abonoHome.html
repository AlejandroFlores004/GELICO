{% extends "base.html" %}

{% block title %}
    Abonos
{% endblock %}

{% block content %}
<main class="p-6 lg:p-8 space-y-8 max-w-7xl mx-auto">
    <div class="flex items-center gap-4">
        <div class="bg-primary text-primary-content rounded-2xl p-4 shadow-md shadow-primary/20">
            <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.75"
                stroke="currentColor"
                class="w-8 h-8"
            >
                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M2.25 8.25h19.5M2.25 9h19.5m-16.5 5.25h6m-6 2.25h3m-3.75 3h15a2.25 2.25 0 002.25-2.25V6.75A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25v10.5A2.25 2.25 0 004.5 19.5z"
                />
            </svg>
        </div>
        <div>
            <h1 class="text-4xl font-bold">
                Abonos
            </h1>
            <p class="text-base-content/70">
                Gestiona los abonos realizados sobre cada recibo.
            </p>
        </div>
    </div>

    <div class="card bg-base-100 border border-base-300 shadow-sm">
        <div class="card-body items-center text-center py-16">
            <p class="text-lg text-base-content/60">Aquí va ir el apartado de Abonos.</p>
        </div>
    </div>

</main>
{% endblock %}
