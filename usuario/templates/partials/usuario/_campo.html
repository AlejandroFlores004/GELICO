<div class="form-control w-full">
    <label class="label" for="{{ field.id_for_label }}"><span class="label-text font-medium">{{ field.label }}{% if field.field.required %} <span class="text-error">*</span>{% endif %}</span></label>
    {{ field }}
    {% if field.errors %}
    {% for error in field.errors %}<span class="block text-error text-xs mt-1">{{ error }}</span>{% endfor %}
    {% elif field.help_text %}<span class="text-xs text-base-content/50 mt-1">{{ field.help_text }}</span>{% endif %}
</div>
