<div class="card bg-base-100 shadow-md border border-base-300">
    <div class="card-body p-4 sm:p-5 gap-3">
        <form
            hx-get="{% url 'buscar_grupos' %}"
            hx-target="#listado-grupos"
            hx-swap="outerHTML"
            hx-indicator="#grupo-search-spinner"
            class="space-y-3"
        >
            <div class="flex flex-col sm:flex-row sm:items-end gap-2">
                <div class="form-control w-full">
                    <label class="label pt-0 pb-1" for="{{ filtro_form.q.id_for_label }}">
                        <span class="label-text font-medium">{{ filtro_form.q.label }}</span>
                    </label>
                    {{ filtro_form.q }}
                </div>
                {% url 'home_grupos' as limpiar %}{% include "partials/base/_filtros_botones.html" with limpiar_url=limpiar spinner_id="grupo-search-spinner" %}
            </div>

            <details class="group"{% if filtro_form.usuario.value %} open{% endif %}>
                {% include "partials/base/_filtros_toggle.html" with detalle="usuario" %}
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-3">
                    <div class="form-control w-full">
                        <label class="label pt-0 pb-1" for="{{ filtro_form.usuario.id_for_label }}">
                            <span class="label-text font-medium">{{ filtro_form.usuario.label }}</span>
                        </label>
                        {{ filtro_form.usuario }}
                    </div>
                </div>
            </details>
        </form>
    </div>
</div>
