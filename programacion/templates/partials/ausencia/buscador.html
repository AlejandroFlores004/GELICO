<div class="card bg-base-100 shadow-md border border-base-300">
    <div class="card-body p-4 sm:p-5 gap-3">
        <form
            hx-get="{% url 'buscar_ausencias' %}"
            hx-target="#listado-ausencias"
            hx-swap="outerHTML"
            hx-indicator="#ausencia-search-spinner"
            class="space-y-3"
        >
            <div class="flex flex-col sm:flex-row sm:items-end gap-2">
                <div class="form-control w-full">
                    <label class="label pt-0 pb-1" for="ausencia-search-text">
                        <span class="label-text font-medium">Auxiliar o motivo</span>
                    </label>
                    <input id="ausencia-search-text" type="text" name="q" value="{{ search|default:'' }}" class="input input-bordered w-full" placeholder="Nombre, apellido o motivo">
                </div>
                {% url 'home_ausencias' as limpiar %}{% include "partials/base/_filtros_botones.html" with limpiar_url=limpiar spinner_id="ausencia-search-spinner" %}
            </div>

            <details class="group"{% if fecha %} open{% endif %}>
                {% include "partials/base/_filtros_toggle.html" with detalle="fecha" %}
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 pt-3">
                    <div class="form-control w-full">
                        <label class="label pt-0 pb-1" for="ausencia-search-date">
                            <span class="label-text font-medium">Fecha</span>
                        </label>
                        <input id="ausencia-search-date" type="date" name="fecha" value="{{ fecha|default:'' }}" class="input input-bordered w-full">
                    </div>
                </div>
            </details>
        </form>
    </div>
</div>
