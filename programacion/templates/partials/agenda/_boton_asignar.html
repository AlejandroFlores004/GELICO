{# Abre el modal para asignar personas a un día de la convocatoria. Recibe `fecha` y `asignados`. #}
<button
    type="button"
    hx-get="{% url 'convocatoria_dia_personas' convocatoria.pk %}?fecha={{ fecha|date:'Y-m-d' }}&origen=convocatoria"
    hx-target="#convocatoria-modal-wrapper"
    hx-swap="outerHTML"
    class="btn btn-xs gap-1 {% if asignados %}btn-ghost border-base-300 text-primary{% else %}btn-outline btn-primary{% endif %}"
    title="{% if asignados %}Agregar o quitar personas del{% else %}Asignar personas al{% endif %} {{ fecha|date:'l j \d\e F' }}"
    aria-label="{% if asignados %}Agregar o quitar personas del{% else %}Asignar personas al{% endif %} {{ fecha|date:'l j \d\e F' }}"
>
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-3.5 h-3.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M18 7.5v3m0 0v3m0-3h3m-3 0h-3m-2.25-4.125a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0ZM3 19.235v-.11a6.375 6.375 0 0 1 12.75 0v.109A12.318 12.318 0 0 1 9.374 21c-2.331 0-4.512-.645-6.374-1.766Z" /></svg>
    {% if asignados %}Gestionar{% else %}Asignar{% endif %}
</button>
