{% comment %}
  Visita en la agenda: una fila del listado del turno con el estado, el código y el nombre corto de
  la escuela. Al hacer clic abre el detalle de la visita.
  Con `con_jornada` (vista de mes, sin filas de turno) antepone la jornada: M, T o TD.
{% endcomment %}
<button
    type="button"
    hx-get="{% url 'programacion_detalle' programacion.pk %}"
    hx-target="#programacion-modal-wrapper"
    hx-swap="outerHTML"
    class="flex w-full min-w-0 cursor-pointer items-center gap-1.5 rounded-md border-l-4 px-2 py-1 text-left text-xs transition hover:shadow-md focus-visible:outline-2 focus-visible:outline-primary
        {% if programacion.cubierta %}border-primary bg-primary/8 hover:bg-primary/15{% else %}border-warning bg-warning/10 hover:bg-warning/20{% endif %}
        {% if programacion.estado == 'no asistio' %}opacity-60{% endif %}"
    title="{{ programacion.escuela.codigo }} · {{ programacion.escuela.nombre }} · {{ programacion.get_jornada_display }} · {{ programacion.get_estado_display }}{% if not programacion.cubierta %} · {% if programacion.cubren %}Cobertura parcial{% else %}Sin cobertura{% endif %}{% endif %}"
    aria-label="Ver la visita a {{ programacion.escuela.nombre }} ({{ programacion.escuela.codigo }}), jornada: {{ programacion.get_jornada_display|lower }}, {{ programacion.get_estado_display|lower }}"
>
    {% include "partials/agenda/_icono_estado.html" with estado=programacion.estado clase="w-3.5 h-3.5" %}
    {% if con_jornada %}<span class="shrink-0 text-[10px] font-bold text-base-content/50">{% if programacion.jornada == 'manana' %}M{% elif programacion.jornada == 'tarde' %}T{% else %}TD{% endif %}</span>{% endif %}
    <span class="shrink-0 font-bold tabular-nums {% if programacion.estado == 'no asistio' %}line-through{% endif %}">{{ programacion.escuela.codigo }}</span>
    <span class="min-w-0 flex-1 truncate text-base-content/70">{{ programacion.escuela.nombre_corto|default:programacion.escuela.nombre }}</span>
    {% if not con_jornada and programacion.jornada == 'completa' %}<span class="shrink-0 rounded bg-base-content/10 px-1 text-[9px] font-bold text-base-content/60" title="Todo el día">TD</span>{% endif %}
</button>
