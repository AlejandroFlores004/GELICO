<button
    type="button"
    hx-get="{% url 'programacion_editar' programacion.pk %}?origen=calendario"
    hx-target="#programacion-modal-wrapper"
    hx-swap="outerHTML"
    class="flex w-full min-w-0 cursor-pointer flex-col rounded-md border-l-4 text-left transition hover:shadow-md focus-visible:outline-2 focus-visible:outline-primary {{ programacion.tono.tarjeta }} {% if compacta %}px-1.5 py-0.5{% else %}gap-0.5 px-2 py-1.5{% endif %} {% if programacion.estado == 'no asistio' %}opacity-60{% endif %}"
    title="{{ programacion.hora_programada|time:'g:i A' }} · {{ programacion.escuela.nombre }} · {{ programacion.auxiliar.nombre }} {{ programacion.auxiliar.apellido }} · {{ programacion.convocatoria.nombre }} · {{ programacion.get_estado_display }}"
    aria-label="Editar la visita a {{ programacion.escuela.nombre_corto|default:programacion.escuela.nombre }} a las {{ programacion.hora_programada|time:'g:i A' }} ({{ programacion.get_estado_display }})"
>
    {% if compacta %}
    <span class="flex min-w-0 items-center gap-1 text-xs">
        {% include "partials/agenda/_icono_estado.html" with estado=programacion.estado clase="w-3 h-3" %}
        <span class="shrink-0 font-semibold tabular-nums">{{ programacion.hora_programada|time:'g:i' }}</span>
        <span class="truncate {% if programacion.estado == 'no asistio' %}line-through{% endif %}">{{ programacion.escuela.nombre_corto|default:programacion.escuela.nombre }}</span>
    </span>
    {% else %}
    <span class="flex items-center justify-between gap-1 text-xs font-semibold tabular-nums text-base-content/70">
        <span>{{ programacion.hora_programada|time:'g:i A' }}</span>
        {% include "partials/agenda/_icono_estado.html" with estado=programacion.estado %}
    </span>
    <span class="truncate text-[13px] font-bold leading-tight {% if programacion.estado == 'no asistio' %}line-through{% endif %}">{{ programacion.escuela.nombre_corto|default:programacion.escuela.nombre }}</span>
    {% if mostrar_auxiliar %}<span class="truncate text-xs text-base-content/80">{{ programacion.auxiliar.nombre }} {{ programacion.auxiliar.apellido }}</span>{% endif %}
    {% if not convocatoria %}<span class="truncate text-xs text-base-content/55">{{ programacion.convocatoria.nombre }}</span>{% endif %}
    {% endif %}
</button>
