<div id="convocatoria-modal-wrapper">
    <dialog id="convocatoria-modal" class="modal">
        <div class="modal-box max-w-xl">
            <form method="dialog">
                <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2" aria-label="Cerrar">✕</button>
            </form>
            <h3 class="font-bold text-xl">Auxiliares del {{ fecha|date:"l j \d\e F"|capfirst }}</h3>
            <p class="mt-1 text-sm text-base-content/70">
                {{ convocatoria.nombre }}. Cada cambio se guarda al momento; cubren las visitas de la jornada de su horario.
            </p>
            {% include "partials/agenda/_asignar_auxiliares_lista.html" %}
            <div class="modal-action">
                <button type="button" class="btn btn-primary" onclick="document.getElementById('convocatoria-modal').close()">Listo</button>
            </div>
        </div>
        <form method="dialog" class="modal-backdrop"><button>close</button></form>
    </dialog>
    <script>
        (function () {
            var wrapper = document.currentScript.closest('#convocatoria-modal-wrapper');
            var dialog = wrapper.querySelector('#convocatoria-modal');
            dialog.showModal();
            dialog.addEventListener('close', function () { wrapper.innerHTML = ''; }, { once: true });
        })();
    </script>
</div>
