<div class="card bg-base-100 shadow-xl border border-base-300">
    <div class="card-body p-0">
        <div class="flex flex-wrap items-center justify-between gap-3 px-6 py-5 border-b border-base-200">
            <div class="flex items-center gap-2">
                <div class="bg-primary/10 text-primary rounded-full p-2">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-3.374-3.374A9.337 9.337 0 0015 19.128z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 01-2.625-.372 9.337 9.337 0 01-4.121-.952 4.125 4.125 0 013.374-3.374A9.337 9.337 0 0115 19.128z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 12.75a3.75 3.75 0 100-7.5 3.75 3.75 0 000 7.5z" />
                    </svg>
                </div>
                <h2 class="card-title m-0">Auxiliares</h2>
            </div>
            <div class="badge badge-outline">
                {{ auxiliares|length }} registros
            </div>
        </div>

        <div class="overflow-x-auto p-4">
            <table class="table table-zebra w-full">
                <thead>
                    <tr>
                        <th class="whitespace-nowrap text-left">Nombre</th>
                        <th class="whitespace-nowrap text-left">Apellido</th>
                        <th class="whitespace-nowrap text-left">Email</th>
                        <th class="whitespace-nowrap text-left">Teléfono</th>
                        <th class="whitespace-nowrap text-left">Institución</th>
                    </tr>
                </thead>
                <tbody>
                    {% for auxiliar in auxiliares %}
                    <tr class="align-middle">
                        <td class="text-center">{{ auxiliar.nombre }}</td>
                        <td class="text-center">{{ auxiliar.apellido }}</td>
                        <td class="text-center">{{ auxiliar.email }}</td>
                        <td class="text-center">{{ auxiliar.telefono|default:"—" }}</td>
                        <td class="text-center">{{ auxiliar.institucion }}</td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="5" class="text-center py-8 text-base-content/70">
                            No existen registros.
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
