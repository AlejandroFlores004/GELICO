<div class="card bg-base-100 shadow-xl">
    <div class="card-body">
        <h2 class="card-title gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 text-primary">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 6h9.75M10.5 6a1.5 1.5 0 11-3 0m3 0a1.5 1.5 0 10-3 0M3.75 6H7.5m3 12h9.75m-9.75 0a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m-3.75 0H7.5m9-6h3.75m-3.75 0a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m-9.75 0h9.75" />
            </svg>
            Buscar Convocatorias
        </h2>
        <div class="divider my-1"></div>
        <form
            hx-get="{% url 'buscar_convocatorias' %}"
            hx-target="#listado-convocatorias"
            hx-swap="outerHTML"
            hx-indicator="#convocatoria-search-spinner"
            class="space-y-4"
        >
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div class="form-control w-full md:col-span-2">
                    <label class="label" for="convocatoria-search-text">
                        <span class="label-text font-medium">Convocatoria</span>
                    </label>
                    <input id="convocatoria-search-text" type="text" name="q" value="{{ search|default:'' }}" class="input input-bordered w-full" placeholder="Nombre o descripción">
                </div>
                <div class="form-control w-full">
                    <label class="label" for="convocatoria-search-start">
                        <span class="label-text font-medium">Desde fecha de inicio</span>
                    </label>
                    <input id="convocatoria-search-start" type="date" name="fecha_inicio" value="{{ fecha_inicio|default:'' }}" class="input input-bordered w-full">
                </div>
                <div class="form-control w-full">
                    <label class="label" for="convocatoria-search-end">
                        <span class="label-text font-medium">Hasta fecha final</span>
                    </label>
                    <input id="convocatoria-search-end" type="date" name="fecha_fin" value="{{ fecha_fin|default:'' }}" class="input input-bordered w-full">
                </div>
            </div>
            <div class="card-actions justify-end">
                <a href="{% url 'home_convocatorias' %}" class="btn btn-ghost gap-2">Limpiar</a>
                <button type="submit" class="btn btn-primary gap-2">
                    <span id="convocatoria-search-spinner" class="htmx-indicator loading loading-spinner loading-sm"></span>
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
                    </svg>
                    Buscar
                </button>
            </div>
        </form>
    </div>
</div>
