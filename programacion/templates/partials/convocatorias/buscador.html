<div class="card bg-base-100 shadow-md border border-base-300">
    <div class="card-body p-4 sm:p-5 gap-3">
        <form
            hx-get="{% url 'buscar_convocatorias' %}"
            hx-target="#listado-convocatorias"
            hx-swap="outerHTML"
            hx-indicator="#convocatoria-search-spinner"
            class="space-y-3"
        >
            <div class="flex flex-col sm:flex-row sm:items-end gap-2">
                <div class="form-control w-full">
                    <label class="label pt-0 pb-1" for="convocatoria-search-text">
                        <span class="label-text font-medium">Buscar convocatoria</span>
                    </label>
                    <input id="convocatoria-search-text" type="text" name="q" value="{{ search|default:'' }}" class="input input-bordered w-full" placeholder="Nombre o descripción">
                </div>
                {% url 'home_programacion' as base_url %}{% include "partials/base/_filtros_botones.html" with limpiar_url=base_url|add:"?seccion=convocatorias" spinner_id="convocatoria-search-spinner" %}
            </div>

            <details class="group"{% if fecha_inicio or fecha_fin %} open{% endif %}>
                {% include "partials/base/_filtros_toggle.html" with detalle="fechas" %}
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-3">
                    <div class="form-control w-full">
                        <label class="label pt-0 pb-1" for="convocatoria-search-start">
                            <span class="label-text font-medium">Desde fecha de inicio</span>
                        </label>
                        <input id="convocatoria-search-start" type="date" name="fecha_inicio" value="{{ fecha_inicio|default:'' }}" class="input input-bordered w-full">
                    </div>
                    <div class="form-control w-full">
                        <label class="label pt-0 pb-1" for="convocatoria-search-end">
                            <span class="label-text font-medium">Hasta fecha final</span>
                        </label>
                        <input id="convocatoria-search-end" type="date" name="fecha_fin" value="{{ fecha_fin|default:'' }}" class="input input-bordered w-full">
                    </div>
                </div>
            </details>
        </form>
    </div>
</div>
