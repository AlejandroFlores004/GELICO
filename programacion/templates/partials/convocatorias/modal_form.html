<div id="convocatoria-modal-wrapper">
    <dialog id="convocatoria-modal" class="modal">
        <div class="modal-box max-w-3xl">
            <form method="dialog">
                <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2" aria-label="Cerrar">✕</button>
            </form>
            <h3 class="font-bold text-xl">{% if instance %}Editar Convocatoria{% else %}Agregar Convocatoria{% endif %}</h3>
            <form
                hx-post="{% if instance %}{% url 'convocatoria_editar' instance.pk %}{% else %}{% url 'convocatoria_nueva' %}{% endif %}{% querystring %}"
                hx-target="#convocatoria-modal-wrapper"
                hx-swap="outerHTML"
                class="space-y-4 mt-4"
            >
                {% csrf_token %}
                {% for field in form %}
                <div class="form-control w-full">
                    <label class="label" for="{{ field.id_for_label }}"><span class="label-text font-medium">{{ field.label }}</span></label>
                    {{ field }}
                    {% if field.errors %}<span class="text-error text-xs mt-1">{{ field.errors.0 }}</span>{% endif %}
                </div>
                {% endfor %}
                <div class="modal-action">
                    <button type="button" class="btn btn-ghost" onclick="document.getElementById('convocatoria-modal').close()">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
        <form method="dialog" class="modal-backdrop"><button>close</button></form>
    </dialog>
    <script>
        (function () {
            var wrapper = document.currentScript.closest('#convocatoria-modal-wrapper');
            var dialog = wrapper.querySelector('#convocatoria-modal');
            dialog.showModal();
            dialog.addEventListener('close', function () { wrapper.innerHTML = ''; }, { once: true });
        })();
    </script>
</div>
