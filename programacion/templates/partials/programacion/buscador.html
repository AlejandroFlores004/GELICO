<div class="card bg-base-100 shadow-xl">
    <div class="card-body">
        <h2 class="card-title gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 text-primary">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 6h9.75M10.5 6a1.5 1.5 0 11-3 0m3 0a1.5 1.5 0 10-3 0M3.75 6H7.5m3 12h9.75m-9.75 0a1.5 1.5 0 11-3 0m3 0a1.5 1.5 0 10-3 0m-3.75 0H7.5m9-6h3.75m-3.75 0a1.5 1.5 0 11-3 0m3 0a1.5 1.5 0 10-3 0m-9.75 0h9.75" />
            </svg>
            Buscar Programaciones
        </h2>
        <div class="divider my-1"></div>
        <form
            id="programacion-buscador-form"
            hx-get="{% url 'buscar_programaciones' %}"
            hx-target="#listado-programaciones"
            hx-swap="outerHTML"
            hx-indicator="#programacion-search-spinner"
            class="space-y-4"
        >
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div class="form-control w-full">
                    <label class="label" for="{{ filtro_form.q.id_for_label }}">
                        <span class="label-text font-medium">Buscar</span>
                    </label>
                    {{ filtro_form.q }}
                </div>
                <div class="form-control w-full">
                    <label class="label" for="{{ filtro_form.convocatoria.id_for_label }}">
                        <span class="label-text font-medium">Convocatoria</span>
                    </label>
                    {{ filtro_form.convocatoria }}
                </div>
                <div class="form-control w-full">
                    <label class="label" for="{{ filtro_form.escuela.id_for_label }}">
                        <span class="label-text font-medium">Escuela</span>
                    </label>
                    {{ filtro_form.escuela }}
                </div>
                <div class="form-control w-full">
                    <label class="label" for="{{ filtro_form.auxiliar.id_for_label }}">
                        <span class="label-text font-medium">Auxiliar</span>
                    </label>
                    {{ filtro_form.auxiliar }}
                </div>
            </div>
            <div class="card-actions justify-end">
                <a href="{% url 'home_programacion' %}" class="btn btn-ghost">Limpiar</a>
                <button type="submit" class="btn btn-primary gap-2">
                    <span id="programacion-search-spinner" class="htmx-indicator loading loading-spinner loading-sm"></span>
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
                    </svg>
                    Buscar
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    (function () {
        document.querySelectorAll('#programacion-buscador-form .django-select2').forEach(function (el) {
            try {
                $(el).djangoSelect2({ width: '100%' });
            } catch (err) {
                console.error('No se pudo inicializar select2', err);
            }
        });
    })();
</script>
