<div class="card bg-base-100 shadow-xl">
    <div class="card-body">

        <h2 class="card-title gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 text-primary">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
            </svg>
            Buscar Encargados
        </h2>

        <div class="divider my-1"></div>

        <form
            hx-get="{% url 'encargado_buscar' %}"
            hx-target="#listado-encargados"
            hx-swap="outerHTML"
            hx-indicator="#encargado-search-spinner"
            class="space-y-4"
        >
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">

                <div class="form-control w-full">
                    <label class="label" for="{{ filtro_form.escuela.id_for_label }}">
                        <span class="label-text font-medium">Distrito</span>
                    </label>
                    <div class="w-full" id="encargado-filtro-escuela-wrapper">
                        {{ filtro_form.distrito }}
                    </div>
                </div>

                <div class="form-control w-full">
                    <label class="label" for="{{ filtro_form.escuela.id_for_label }}">
                        <span class="label-text font-medium">Escuela</span>
                    </label>
                    <div class="w-full" id="encargado-filtro-escuela-wrapper">
                        {{ filtro_form.escuela }}
                    </div>
                </div>

                <div class="form-control w-full">
                    <label class="label" for="{{ filtro_form.estado.id_for_label }}">
                        <span class="label-text font-medium">Estado</span>
                    </label>
                    {{ filtro_form.estado }}
                </div>

                <div class="form-control w-full">
                    <label class="label" for="{{ filtro_form.texto.id_for_label }}">
                        <span class="label-text font-medium">Buscar</span>
                    </label>
                    {{ filtro_form.texto }}
                </div>

            </div>

            <div class="card-actions justify-end">
                <a href="{% url 'home_encargados' %}" class="btn btn-ghost gap-2">
                    Limpiar
                </a>
                <button type="submit" class="btn btn-primary gap-2">
                    <span id="encargado-search-spinner" class="htmx-indicator loading loading-spinner loading-sm"></span>
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
                    </svg>
                    Buscar
                </button>
            </div>
        </form>
    </div>
</div>
