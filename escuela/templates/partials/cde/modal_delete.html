<div id="cde-modal-wrapper">
    <dialog id="cde-modal" class="modal open" open>
        <div class="modal-box max-w-md">
            <h3 class="font-bold text-lg">Eliminar CDE</h3>
            <p class="py-4">
                ¿Seguro que deseas eliminar el periodo de CDE para la escuela <strong>{{ instance.escuela.nombre_corto }}</strong> del {{ instance.FechaInicio|date:"d/m/Y" }} al {{ instance.FechaFin|date:"d/m/Y" }}?
            </p>
            <form
                hx-post="{% url 'cde_eliminar' instance.pk %}{% querystring %}"
                hx-target="#cde-modal-wrapper"
                hx-swap="outerHTML"
                class="modal-action"
            >
                {% csrf_token %}
                <button type="button" class="btn btn-ghost" onclick="document.getElementById('cde-modal').close(); this.closest('#cde-modal-wrapper').innerHTML=''">Cancelar</button>
                <button type="submit" class="btn btn-error">Eliminar</button>
            </form>
        </div>
        <form method="dialog" class="modal-backdrop"><button>close</button></form>
    </dialog>
</div>
