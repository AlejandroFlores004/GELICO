<div id="cde-modal-wrapper">
    <dialog id="cde-modal" class="modal">
        <div class="modal-box max-w-3xl">
            <form method="dialog">
                <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2" aria-label="Cerrar">✕</button>
            </form>
            <h3 class="font-bold text-xl">{% if instance %}Editar CDE{% else %}Agregar CDE{% endif %}</h3>
            <form
                hx-post="{% if instance %}{% url 'cde_editar' instance.pk %}{% else %}{% url 'cde_nuevo' %}{% endif %}{% querystring %}"
                hx-target="#cde-modal-wrapper"
                hx-swap="outerHTML"
                class="space-y-4 mt-4"
            >
                {% csrf_token %}
                {% for field in form %}
                <div class="form-control w-full">
                    <label class="label" for="{{ field.id_for_label }}"><span class="label-text font-medium">{{ field.label }}</span></label>
                    {{ field }}
                    {% if field.errors %}<span class="text-error text-xs mt-1">{{ field.errors.0 }}</span>{% endif %}
                </div>
                {% endfor %}
                <div class="modal-action">
                    <button type="button" class="btn btn-ghost" onclick="document.getElementById('cde-modal').close()">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
        <form method="dialog" class="modal-backdrop"><button>close</button></form>
    </dialog>

    <script>
        (function () {
            var wrapper = document.currentScript.closest('#cde-modal-wrapper');
            var dialog = wrapper.querySelector('#cde-modal');
            dialog.showModal();

            wrapper.querySelectorAll('.django-select2').forEach(function (el) {
                try {
                    var $el = $(el);
                    if ($el.hasClass('select2-hidden-accessible')) {
                        $el.select2('destroy');
                    }
                    $el.djangoSelect2({ width: '100%', dropdownParent: $(dialog) });
                } catch (err) {
                    console.error('No se pudo inicializar select2', err);
                }
            });

            dialog.addEventListener('close', function () {
                wrapper.querySelectorAll('.django-select2.select2-hidden-accessible').forEach(function (el) {
                    $(el).select2('destroy');
                });
                wrapper.innerHTML = '';
            }, { once: true });
        })();
    </script>
</div>
